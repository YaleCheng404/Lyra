# 构建配置

[urls]
# 工具下载地址
apktool = "https://github.com/iBotPeaches/Apktool/releases/download/v3.0.3/apktool_3.0.3.jar"
apktool_sha256 = "dbf930b076c6b9be08d57c449cacefc3bdd6b71ebd59b3066fc0e1f5b14f9423"
uber_apk_signer = "https://github.com/patrickfav/uber-apk-signer/releases/download/v1.3.0/uber-apk-signer-1.3.0.jar"
uber_apk_signer_sha256 = "e1299fd6fcf4da527dd53735b56127e8ea922a321128123b9c32d619bba1d835"

# DOLP 基础 URL
dolp_base = "https://gitgud.io/Frostberg/degrees-of-lewdity-plus/-/archive/master/degrees-of-lewdity-plus-master.tar.gz?path=imagepacks"

# 上游汉化发布仓库
chs_repo = "Eltirosto/Degrees-of-Lewdity-Chinese-Localization"

[paths]
# 工作目录
workspace = "workspace"
output = "output"

# 子目录（相对于 workspace）
extract = "extract"
temp = "temp"
signed = "signed"
base = "base"
prepare_package = "prepare_package"

[github]
# GitHub 发布配置。留空时 GitHub Actions 使用当前仓库。
owner = ""
repo = ""

# APK 包名替换规则
[[apk.replacements]]
file = "AndroidManifest.xml"
pattern = '"com.vrelnir.dol"'
replacement = '"com.vrelnir.dol.lyra"'

[[apk.replacements]]
file = "AndroidManifest.xml"
pattern = '"com.vrelnir.dol_debug"'
replacement = '"com.vrelnir.dol.lyra"'

[[apk.replacements]]
file = "AndroidManifest.xml"
pattern = '"com.vrelnir.dol.androidx-startup"'
replacement = '"com.vrelnir.dol.lyra.androidx-startup"'

[[apk.replacements]]
file = "AndroidManifest.xml"
pattern = '"com.vrelnir.dol_debug.androidx-startup"'
replacement = '"com.vrelnir.dol.lyra.androidx-startup"'

[[apk.replacements]]
file = "res/values/strings.xml"
pattern = "DoL"
replacement = "DoL Lyra"

[[apk.replacements]]
file = "res/values/strings.xml"
pattern = "Degrees of Lewdity"
replacement = "DoL Lyra"

[[apk.replacements]]
file = "assets/www/index.html"
pattern = "saveAs("
replacement = "cordova.plugins.saveDialog.saveFile("

# 图片包配置
[imagepacks.besc]
urls = [
    "{dolp_base}/dolp",
    "{dolp_base}/b3s",
    "{dolp_base}/kaervek",
    "{dolp_base}/dolp_b3s",
]

[imagepacks.besc.case_fixes]
"img/hair/fringe/Messy curls" = "img/hair/fringe/messy curls"
"img/hair/sides/messy ponytail/Shoulder.png" = "img/hair/sides/messy ponytail/shoulder.png"

[imagepacks.hikari]
urls = ["{dolp_base}/b3s_hikfem", "{dolp_base}/b3s_hikfemsubs"]
files_to_remove = [
    "img/hair/fringe/Messy curls",
    "img/clothes/face/foxmask/Full.png",
]

[imagepacks.ucb]
urls = ["{dolp_base}/mysterious"]
files_to_remove = [
    "img/sex/missionary/active/virginkiller/chest.png",
    "img/sex/missionary/active/virginkiller/waist.png",
]

# Modloader mod 配置
# 通过 feature_id 关联 features.toml 中的功能定义
[[modloader_mods]]
feature_id = "au-f"
github_repo = "AOKIUTAGE/UTAGEsDOL3.0"
asset_pattern = "AUfemale.model"
release_tag = "mod"

# 基础 mod 注入配置（按列表顺序处理）
# key: mod 标识，对应 extra_mods 字典中的键
# github_repo: GitHub 仓库，每次准备时查询最新正式 Release
# asset_pattern: 附件 glob，必须唯一匹配；required: 获取失败时终止构建
# inject: 注入方式，"add" 追加（默认） / "replace" 替换指定 slot
# replace_slot: 替换的 slot 索引（仅 inject="replace" 时有效）

[[base_mods]]
key = "modloader_gui"
github_repo = "DoL-Lyra/sugarcube-2-ModLoaderGui"
inject = "replace"
replace_slot = 0                                  # 替换原始 ModLoader (slot 0)

[[base_mods]]
key = "i18n"

[[base_mods]]
key = "cheat"
github_repo = "DoL-Lyra/Cheat"

[[base_mods]]
key = "csd"
github_repo = "DoL-Lyra/CombatStatusDisplay"

[[base_mods]]
key = "maplebirch"
name = "秋枫白桦框架"
github_repo = "MaplebirchLeaf/SCML-DOL-maplebirchFramework"
asset_pattern = "maplebirch-*.mod.zip"
required = true

[[base_mods]]
key = "deadwood-reblooms"
name = "枯木逢春"
github_repo = "MaplebirchLeaf/Deadwood-Reblooms"
asset_pattern = "deadwood-reblooms-[0-9]*.modpack"
required = true

[[base_mods]]
key = "deadwood-reblooms-audio"
name = "枯木逢春音频"
github_repo = "MaplebirchLeaf/Deadwood-Reblooms"
asset_pattern = "deadwood-reblooms-audio-*.modpack"
required = true

[[base_mods]]
key = "revelation-the-book-of-return"
name = "默示录：归途之书"
github_repo = "MaplebirchLeaf/Revelation-The-Book-of-Return"
asset_pattern = "revelation-the-book-of-return-*.modpack"
required = true

[[base_mods]]
key = "dynamicest"
name = "极致动态 Dynamicest"
github_repo = "ANLINSTUDIO/Degrees-of-Lewdity-DolDynamicest"
asset_pattern = "Dynamicest-*.mod.zip"
required = true
