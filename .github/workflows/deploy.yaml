name: Deploy Online

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

env:
  DOWNLOAD_RELEASE_TEMP_PATH: ${{ github.workspace }}/modloader-temp

  MODLOADER_HTML_NORMAL_FILENAME: "dol.html"
  MODLOADER_HTML_POLYFILL_FILENAME: "dol-polyfill.html"

  MANIFEST_JSON_NORMAL_FILENAME: "manifest-normal.json"
  MANIFEST_JSON_POLYFILL_FILENAME: "manifest-polyfill.json"

  UPLOAD_ARTIFACT_NAME: "ModLoader-Artifact"
  REPOSITORY_NAME: ${{ github.event.repository.name }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Make Directories
        run: mkdir -p "$DOWNLOAD_RELEASE_TEMP_PATH"

      - id: getRelease
        name: Download latest normal release
        uses: robinraju/release-downloader@28fc21f50d76778e7023361aa1f863e717d3d56f # v1.13
        with:
          latest: true
          fileName: "DoL-*-Lyra-*-besc-[0-9]*.zip"

      - id: getRelease-polyfill
        name: Download latest polyfill release
        uses: robinraju/release-downloader@28fc21f50d76778e7023361aa1f863e717d3d56f # v1.13
        with:
          latest: true
          fileName: "DoL-*-Lyra-*-polyfill-besc-*.zip"

      - name: Extract downloaded files
        env:
          NORMAL_TAG: ${{ steps.getRelease.outputs.tag_name }}
          NORMAL_ARCHIVE: ${{ fromJson(steps.getRelease.outputs.downloaded_files)[0] }}
          POLYFILL_TAG: ${{ steps.getRelease-polyfill.outputs.tag_name }}
          POLYFILL_ARCHIVE: ${{ fromJson(steps.getRelease-polyfill.outputs.downloaded_files)[0] }}
        run: |
          echo "Downloaded DoL: $NORMAL_TAG"
          unzip -q "$NORMAL_ARCHIVE" -d "$DOWNLOAD_RELEASE_TEMP_PATH"
          mv "$DOWNLOAD_RELEASE_TEMP_PATH/Degrees of Lewdity.html" "$DOWNLOAD_RELEASE_TEMP_PATH/dol.html"

          echo "Downloaded DoL Polyfill: $POLYFILL_TAG"
          unzip -qo "$POLYFILL_ARCHIVE" -d "$DOWNLOAD_RELEASE_TEMP_PATH"
          mv "$DOWNLOAD_RELEASE_TEMP_PATH/Degrees of Lewdity.html" "$DOWNLOAD_RELEASE_TEMP_PATH/dol-polyfill.html"

      - name: Construct PWA
        run: cp -r .github/pwa/* "$DOWNLOAD_RELEASE_TEMP_PATH"

      - name: Modify HTML
        shell: python3 {0}
        run: |
          import os

          for html_name, manifest_name in zip(
            [os.environ["MODLOADER_HTML_NORMAL_FILENAME"], os.environ["MODLOADER_HTML_POLYFILL_FILENAME"]],
            [os.environ["MANIFEST_JSON_NORMAL_FILENAME"], os.environ["MANIFEST_JSON_POLYFILL_FILENAME"]]
          ):
            path = os.path.join(os.environ["DOWNLOAD_RELEASE_TEMP_PATH"], html_name)
            with open(path, "r+", encoding="utf-8") as index_html_file:
              index_html = index_html_file.read()
              insert_index = index_html.find('<meta charset="UTF-8" />')
              index_html = index_html[:insert_index] + \
                  f"<link rel=\"manifest\" href=\"{manifest_name}\">\n" + index_html[insert_index:]
              insert_index = index_html.find('<body>\n\t<div id="init-screen">') + 7
              index_html = index_html[:insert_index] + \
                  "    <script>\n" + \
                  "        if (typeof navigator.serviceWorker !== 'undefined') {\n" + \
                  "            navigator.serviceWorker.register('sw.js')\n" + \
                  "        }\n" + \
                  "    </script>\n" + index_html[insert_index:]
              index_html_file.seek(0)
              index_html_file.truncate()
              index_html_file.write(index_html)

      - name: Upload Artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.UPLOAD_ARTIFACT_NAME }}
          path: ${{ env.DOWNLOAD_RELEASE_TEMP_PATH }}

  deploy-github:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download Artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ env.UPLOAD_ARTIFACT_NAME }}
          path: ${{ env.DOWNLOAD_RELEASE_TEMP_PATH }}

      - name: Modify manifest.json
        shell: python3 {0}
        run: |
          import json
          import os

          repo_path = f"/{os.environ['REPOSITORY_NAME']}/"
          for manifest_name in [os.environ["MANIFEST_JSON_NORMAL_FILENAME"], os.environ["MANIFEST_JSON_POLYFILL_FILENAME"]]:
            path = os.path.join(os.environ["DOWNLOAD_RELEASE_TEMP_PATH"], manifest_name)
            with open(path, "r+", encoding="utf-8") as manifest_file:
              manifest_json = json.loads(manifest_file.read())
              manifest_json["scope"] = repo_path
              manifest_json["start_url"] = repo_path
              manifest_json["shortcuts"][0]["url"] = repo_path
              manifest_json["icons"][0]["src"] = f"{repo_path}icon.png"
              manifest_file.seek(0)
              manifest_file.truncate()
              manifest_file.write(json.dumps(manifest_json, indent=2))

      - name: Remove gitignore from img
        run: rm -f ./modloader-temp/img/.gitignore

      - name: Deploy to current repository online branch
        uses: crazy-max/ghaction-github-pages@1d6ee9b181a81033a16bd707a1401afa978daab4 # v5.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          repo: ${{ github.repository }}
          build_dir: ./modloader-temp
          keep_history: false
          target_branch: online
