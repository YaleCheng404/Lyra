name: Deploy Online

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: write

concurrency:
  group: deploy-online
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Prepare online site from latest release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh release view --json tagName --jq '.tagName')
          IFS=- read -r game chs date <<< "${tag#v}"
          gh release download "$tag" \
            --pattern "DoL-$game-Lyra-$chs-besc-$date.zip" \
            --output "$RUNNER_TEMP/lyra-online.zip"
          unzip -q "$RUNNER_TEMP/lyra-online.zip" -d online-site
          mv 'online-site/Degrees of Lewdity.html' online-site/dol.html
          cp .github/pwa/* online-site/

          python3 - <<'PY'
          from pathlib import Path

          page = Path("online-site/dol.html")
          html = page.read_text(encoding="utf-8")
          end = html.lower().index("</head>")
          pwa = (
              '<link rel="manifest" href="manifest.json">\n'
              "<script>if ('serviceWorker' in navigator) "
              "navigator.serviceWorker.register('sw.js');</script>\n"
          )
          page.write_text(html[:end] + pwa + html[end:], encoding="utf-8")
          PY

      - name: Deploy to online branch
        uses: crazy-max/ghaction-github-pages@1d6ee9b181a81033a16bd707a1401afa978daab4 # v5.0.1
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          build_dir: online-site
          keep_history: false
          target_branch: online
