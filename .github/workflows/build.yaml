name: Build

on:
  push:
    branches:
      - main
      - master
      - vega
    tags:
      - "v*"
    paths-ignore:
      - "README.md"
      - "LICENSE"
      - ".github/workflows/trigger.yaml"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to build, for example v0.5.10.12-1.0.8a-0628"
        required: false
        type: string

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: build-${{ github.ref }}-${{ inputs.release_tag || 'push' }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.meta.outputs.release_tag }}
      is_release: ${{ steps.meta.outputs.is_release }}
    steps:
      - uses: actions/checkout@v6

      - name: Resolve build metadata
        id: meta
        shell: bash
        run: |
          TAG="${{ inputs.release_tag || '' }}"
          if [[ -z "$TAG" && "${{ github.ref_type }}" == "tag" ]]; then
            TAG="${{ github.ref_name }}"
          fi

          if [[ -n "$TAG" ]]; then
            echo "release_tag=$TAG" >> "$GITHUB_OUTPUT"
            echo "is_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "release_tag=" >> "$GITHUB_OUTPUT"
            echo "is_release=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: "pip"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Install APT packages
        run: sudo apt-get update && sudo apt-get install -y unrar

      - name: Prepare game packages
        shell: bash
        run: |
          if [[ "${{ steps.meta.outputs.is_release }}" == "true" ]]; then
            python main.py prepare --workspace "${{ github.workspace }}" --tag "${{ steps.meta.outputs.release_tag }}" -v
          else
            python main.py prepare --workspace "${{ github.workspace }}" -v
          fi

      - name: Setup APK signing key
        shell: bash
        run: |
          if [[ -n "${{ secrets.SIGNING_KEY }}" ]]; then
            echo "${{ secrets.SIGNING_KEY }}" > dol.base64
            base64 -d dol.base64 > dol.jks
          else
            keytool -genkeypair \
              -alias dol \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -keystore dol.jks \
              -storepass dolchs \
              -keypass dolchs \
              -dname "CN=DoL Lyra CI,O=GitHub Actions,C=US"
          fi

      - name: Warmup beautify resources
        run: python main.py warmup --workspace "${{ github.workspace }}" -v

      - name: Build all combinations
        shell: bash
        run: |
          if [[ "${{ steps.meta.outputs.is_release }}" == "true" ]]; then
            python main.py build --workspace "${{ github.workspace }}" --tag "${{ steps.meta.outputs.release_tag }}" --jobs 4 -v
          else
            python main.py build --workspace "${{ github.workspace }}" --jobs 4 -v
          fi

      - name: List outputs
        run: ls -lah "${{ github.workspace }}/output/" || echo "No output files generated"

      - name: Generate download page
        if: steps.meta.outputs.is_release == 'true'
        shell: bash
        run: |
          VERSION="${{ steps.meta.outputs.release_tag }}"
          python main.py page \
            --version "$VERSION" \
            --github-owner "${{ github.repository_owner }}" \
            --github-repo "${{ github.event.repository.name }}" \
            --versions-file "${{ github.workspace }}/base/versions.json" \
            --output "output/$VERSION.md" \
            -v
          cat "output/$VERSION.md"

      - name: Pick sample outputs
        if: steps.meta.outputs.is_release != 'true'
        id: sample
        shell: bash
        run: |
          ZIP_FILE=$(find "${{ github.workspace }}/output" -maxdepth 1 -type f -name "*.zip" | sort | head -n 1)
          APK_FILE=$(find "${{ github.workspace }}/output" -maxdepth 1 -type f -name "*.apk" | sort | head -n 1)

          echo "zip=$ZIP_FILE" >> "$GITHUB_OUTPUT"
          echo "apk=$APK_FILE" >> "$GITHUB_OUTPUT"

      - name: Upload ZIP sample artifact
        if: steps.meta.outputs.is_release != 'true' && steps.sample.outputs.zip != ''
        uses: actions/upload-artifact@v6
        with:
          name: dol-builds-zip-sample
          path: ${{ steps.sample.outputs.zip }}

      - name: Upload APK sample artifact
        if: steps.meta.outputs.is_release != 'true' && steps.sample.outputs.apk != ''
        uses: actions/upload-artifact@v6
        with:
          name: dol-builds-apk-sample
          path: ${{ steps.sample.outputs.apk }}

      - name: Upload ZIP artifacts
        uses: actions/upload-artifact@v6
        with:
          name: dol-builds-zip
          path: ${{ github.workspace }}/output/*.zip

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v6
        with:
          name: dol-builds-apk
          path: ${{ github.workspace }}/output/*.apk

      - name: Upload download page artifact
        if: steps.meta.outputs.is_release == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: download-page
          path: ${{ github.workspace }}/output/*.md

  release:
    runs-on: ubuntu-latest
    needs: build
    if: needs.build.outputs.is_release == 'true'
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: dol-builds-zip
          path: outputs/

      - uses: actions/download-artifact@v7
        with:
          name: dol-builds-apk
          path: outputs/

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build.outputs.release_tag }}
          name: ${{ needs.build.outputs.release_tag }}
          make_latest: true
          files: |
            outputs/*.zip
            outputs/*.apk

  deploy-hub:
    runs-on: ubuntu-latest
    needs:
      - build
      - release
    if: needs.build.outputs.is_release == 'true'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v7
        with:
          name: download-page
          path: hub/content/posts/downloads/

      - name: Set up Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "latest"
          extended: true

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build hub
        working-directory: hub
        run: hugo --destination public --baseURL "${{ steps.pages.outputs.base_url }}/"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: hub/public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
