name: Build

on:
  push:
    branches:
      - main
      - master
      - vega
    tags:
      - "v*"
    paths-ignore:
      - "README.md"
      - "LICENSE"
      - ".github/workflows/trigger.yaml"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to build, for example v0.5.10.12-1.0.8a-0628"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}-${{ inputs.release_tag || 'push' }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      BUILD_WORKSPACE: ${{ github.workspace }}
    outputs:
      release_tag: ${{ steps.meta.outputs.release_tag }}
      is_release: ${{ steps.meta.outputs.is_release }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Resolve build metadata
        id: meta
        shell: bash
        env:
          INPUT_RELEASE_TAG: ${{ inputs.release_tag || '' }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          TAG="$INPUT_RELEASE_TAG"
          if [[ -z "$TAG" && "$REF_TYPE" == "tag" ]]; then
            TAG="$REF_NAME"
          fi

          if [[ -n "$TAG" ]]; then
            if [[ ! "$TAG" =~ ^v[0-9]+(\.[0-9]+){3}-[0-9]+(\.[0-9]+){2}[0-9A-Za-z]*-[0-9]{4}$ ]]; then
              echo "Invalid release tag: $TAG" >&2
              exit 1
            fi
            echo "release_tag=$TAG" >> "$GITHUB_OUTPUT"
            echo "is_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "release_tag=" >> "$GITHUB_OUTPUT"
            echo "is_release=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version-file: .python-version
          cache: "pip"

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Verify Python sources
        run: |
          python -m unittest discover -v
          python -m compileall -q main.py lyra scripts

      - uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5.5.0
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Install APT packages
        run: sudo apt-get update && sudo apt-get install -y unrar

      - name: Prepare game packages
        shell: bash
        env:
          IS_RELEASE: ${{ steps.meta.outputs.is_release }}
          RELEASE_TAG: ${{ steps.meta.outputs.release_tag }}
        run: |
          if [[ "$IS_RELEASE" == "true" ]]; then
            python main.py prepare --workspace "$BUILD_WORKSPACE" --tag "$RELEASE_TAG" -v
          else
            python main.py prepare --workspace "$BUILD_WORKSPACE" -v
          fi

      - name: Setup APK signing key
        shell: bash
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        run: |
          if [[ -n "$SIGNING_KEY" ]]; then
            printf '%s' "$SIGNING_KEY" | base64 -d > dol.jks
          else
            keytool -genkeypair \
              -alias dol \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -keystore dol.jks \
              -storepass dolchs \
              -keypass dolchs \
              -dname "CN=DoL Lyra CI,O=GitHub Actions,C=US"
          fi

      - name: Warmup beautify resources
        run: python main.py warmup --workspace "$BUILD_WORKSPACE" -v

      - name: Build all combinations
        shell: bash
        env:
          IS_RELEASE: ${{ steps.meta.outputs.is_release }}
          RELEASE_TAG: ${{ steps.meta.outputs.release_tag }}
        run: |
          if [[ "$IS_RELEASE" == "true" ]]; then
            python main.py build --workspace "$BUILD_WORKSPACE" --tag "$RELEASE_TAG" --jobs 4 -v
          else
            python main.py build --workspace "$BUILD_WORKSPACE" --jobs 4 -v
          fi

      - name: List outputs
        run: ls -lah "$BUILD_WORKSPACE/output/" || echo "No output files generated"

      - name: Generate download page
        if: steps.meta.outputs.is_release == 'true'
        shell: bash
        env:
          VERSION: ${{ steps.meta.outputs.release_tag }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          REPOSITORY_NAME: ${{ github.event.repository.name }}
        run: |
          python main.py page \
            --version "$VERSION" \
            --github-owner "$REPOSITORY_OWNER" \
            --github-repo "$REPOSITORY_NAME" \
            --versions-file "$BUILD_WORKSPACE/base/versions.json" \
            --output "output/$VERSION.md" \
            -v
          cat "output/$VERSION.md"

      - name: Pick sample outputs
        if: steps.meta.outputs.is_release != 'true'
        id: sample
        shell: bash
        run: |
          ZIP_FILE=$(find "$BUILD_WORKSPACE/output" -maxdepth 1 -type f -name "*.zip" | sort | head -n 1)
          APK_FILE=$(find "$BUILD_WORKSPACE/output" -maxdepth 1 -type f -name "*.apk" | sort | head -n 1)

          echo "zip=$ZIP_FILE" >> "$GITHUB_OUTPUT"
          echo "apk=$APK_FILE" >> "$GITHUB_OUTPUT"

      - name: Upload ZIP sample artifact
        if: steps.meta.outputs.is_release != 'true' && steps.sample.outputs.zip != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dol-builds-zip-sample
          path: ${{ steps.sample.outputs.zip }}

      - name: Upload APK sample artifact
        if: steps.meta.outputs.is_release != 'true' && steps.sample.outputs.apk != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dol-builds-apk-sample
          path: ${{ steps.sample.outputs.apk }}

      - name: Upload ZIP artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dol-builds-zip
          path: ${{ github.workspace }}/output/*.zip

      - name: Upload APK artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dol-builds-apk
          path: ${{ github.workspace }}/output/*.apk

      - name: Upload download page artifact
        if: steps.meta.outputs.is_release == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: download-page
          path: ${{ github.workspace }}/output/*.md

  release:
    runs-on: ubuntu-latest
    needs: build
    if: needs.build.outputs.is_release == 'true'
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dol-builds-zip
          path: outputs/

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dol-builds-apk
          path: outputs/

      - name: Upload to release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ needs.build.outputs.release_tag }}
          name: ${{ needs.build.outputs.release_tag }}
          make_latest: true
          files: |
            outputs/*.zip
            outputs/*.apk

  deploy-hub:
    runs-on: ubuntu-latest
    needs:
      - build
      - release
    if: needs.build.outputs.is_release == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: download-page
          path: hub/content/posts/downloads/

      - name: Set up Hugo
        uses: peaceiris/actions-hugo@2752ce1d29631191ea3f27c23495fa06139a5b78 # v3.2.1
        with:
          hugo-version: "0.164.0"
          extended: true

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Build hub
        working-directory: hub
        env:
          PAGES_BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: hugo --destination public --baseURL "$PAGES_BASE_URL/"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: hub/public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
