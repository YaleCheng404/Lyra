name: Build

on:
  push:
    branches:
      - main
      - master
      - vega
    tags:
      - "v*"
    paths-ignore:
      - "README.md"
      - "LICENSE"
      - ".github/workflows/trigger.yaml"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to build, for example v0.5.10.12-1.0.8a-0628"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}-${{ inputs.release_tag || 'push' }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      BUILD_WORKSPACE: ${{ github.workspace }}
    outputs:
      release_tag: ${{ steps.meta.outputs.release_tag }}
      is_release: ${{ steps.meta.outputs.is_release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve build metadata
        id: meta
        shell: bash
        env:
          INPUT_RELEASE_TAG: ${{ inputs.release_tag || '' }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          TAG="$INPUT_RELEASE_TAG"
          if [[ -z "$TAG" && "$REF_TYPE" == "tag" ]]; then
            TAG="$REF_NAME"
          fi

          if [[ -n "$TAG" ]]; then
            if [[ ! "$TAG" =~ ^v[0-9]+(\.[0-9]+){3}-[0-9]+(\.[0-9]+){2}[0-9A-Za-z]*-[0-9]{4}$ ]]; then
              echo "Invalid release tag: $TAG" >&2
              exit 1
            fi
            echo "release_tag=$TAG" >> "$GITHUB_OUTPUT"
            echo "is_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "release_tag=" >> "$GITHUB_OUTPUT"
            echo "is_release=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version
          cache: "pip"

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Verify Python sources
        run: |
          python -m unittest discover -v
          python -m compileall -q main.py lyra scripts

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: "temurin"
          java-version: "25"

      - name: Prepare game packages
        shell: bash
        env:
          IS_RELEASE: ${{ steps.meta.outputs.is_release }}
          RELEASE_TAG: ${{ steps.meta.outputs.release_tag }}
        run: |
          if [[ "$IS_RELEASE" == "true" ]]; then
            python main.py prepare --workspace "$BUILD_WORKSPACE" --tag "$RELEASE_TAG" -v
          else
            python main.py prepare --workspace "$BUILD_WORKSPACE" -v
          fi

      - name: Setup APK signing key
        shell: bash
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        run: |
          if [[ -n "$SIGNING_KEY" ]]; then
            printf '%s' "$SIGNING_KEY" | base64 -d > dol.jks
          else
            keytool -genkeypair \
              -alias dol \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -keystore dol.jks \
              -storepass dolchs \
              -keypass dolchs \
              -dname "CN=DoL Lyra CI,O=GitHub Actions,C=US"
          fi

      - name: Warmup beautify resources
        run: python main.py warmup --workspace "$BUILD_WORKSPACE" -v

      - name: Build all combinations
        shell: bash
        env:
          IS_RELEASE: ${{ steps.meta.outputs.is_release }}
          RELEASE_TAG: ${{ steps.meta.outputs.release_tag }}
        run: |
          if [[ "$IS_RELEASE" == "true" ]]; then
            python main.py build --workspace "$BUILD_WORKSPACE" --tag "$RELEASE_TAG" --jobs 4 -v
          else
            python main.py build --workspace "$BUILD_WORKSPACE" --jobs 4 -v
          fi

      - name: List outputs
        run: ls -lah "$BUILD_WORKSPACE/output/" || echo "No output files generated"

      - name: Verify all packages
        env:
          RELEASE_TAG: ${{ steps.meta.outputs.release_tag }}
        run: |
          if [[ -n "$RELEASE_TAG" ]]; then
            python main.py verify --workspace "$BUILD_WORKSPACE" --tag "$RELEASE_TAG" -v
          else
            python main.py verify --workspace "$BUILD_WORKSPACE" -v
          fi

      - name: Upload verification report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verification-report
          path: |
            output/build-manifest.json
            output/release-notes.md

      - name: Install browser test tools
        run: |
          python -m pip install playwright==1.64.1
          python -m playwright install --with-deps chromium

      - name: Verify normal and polyfill browser runtime
        run: |
          NORMAL=$(find "$BUILD_WORKSPACE/output" -maxdepth 1 -type f -name '*-besc-[0-9]*.zip' ! -name '*-polyfill-*')
          POLYFILL=$(find "$BUILD_WORKSPACE/output" -maxdepth 1 -type f -name '*-polyfill-besc-*.zip')
          python scripts/browser_smoke.py "$NORMAL" "$POLYFILL"

      - name: Upload browser checks
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-smoke
          path: output/browser-smoke/
          if-no-files-found: ignore

      - name: Generate download page
        if: steps.meta.outputs.is_release == 'true'
        shell: bash
        env:
          VERSION: ${{ steps.meta.outputs.release_tag }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          REPOSITORY_NAME: ${{ github.event.repository.name }}
        run: |
          python main.py page \
            --version "$VERSION" \
            --github-owner "$REPOSITORY_OWNER" \
            --github-repo "$REPOSITORY_NAME" \
            --versions-file "$BUILD_WORKSPACE/base/versions.json" \
            --output "output/$VERSION.md" \
            -v
          cat "output/$VERSION.md"

      - name: Pick sample outputs
        if: steps.meta.outputs.is_release != 'true'
        id: sample
        shell: bash
        run: |
          ZIP_FILE=$(find "$BUILD_WORKSPACE/output" -maxdepth 1 -type f -name "*.zip" | sort | head -n 1)
          APK_FILE=$(find "$BUILD_WORKSPACE/output" -maxdepth 1 -type f -name "*.apk" | sort | head -n 1)

          echo "zip=$ZIP_FILE" >> "$GITHUB_OUTPUT"
          echo "apk=$APK_FILE" >> "$GITHUB_OUTPUT"

      - name: Upload ZIP sample artifact
        if: steps.meta.outputs.is_release != 'true' && steps.sample.outputs.zip != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dol-builds-zip-sample
          path: ${{ steps.sample.outputs.zip }}

      - name: Upload APK sample artifact
        if: steps.meta.outputs.is_release != 'true' && steps.sample.outputs.apk != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dol-builds-apk-sample
          path: ${{ steps.sample.outputs.apk }}

      - name: Upload ZIP artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dol-builds-zip
          path: ${{ github.workspace }}/output/*.zip

      - name: Upload APK artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dol-builds-apk
          path: ${{ github.workspace }}/output/*.apk

      - name: Upload download page artifact
        if: steps.meta.outputs.is_release == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: download-page
          path: ${{ github.workspace }}/output/${{ steps.meta.outputs.release_tag }}.md

  release:
    runs-on: ubuntu-latest
    needs: build
    if: needs.build.outputs.is_release == 'true'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check release tag belongs to this build
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.build.outputs.release_tag }}
        run: |
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" > tag.json 2>/dev/null; then
            TYPE=$(jq -r '.object.type' tag.json)
            SHA=$(jq -r '.object.sha' tag.json)
            if [[ "$TYPE" == "tag" ]]; then
              SHA=$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$SHA" --jq '.object.sha')
            fi
            test "$SHA" = "$GITHUB_SHA" || { echo "Release tag points to another commit" >&2; exit 1; }
          else
            test "$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/$RELEASE_TAG" --jq 'length')" = "0"
          fi

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: verification-report
          path: verification/

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dol-builds-zip
          path: outputs/

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dol-builds-apk
          path: outputs/

      - name: Upload to release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ needs.build.outputs.release_tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ needs.build.outputs.release_tag }}
          body_path: verification/release-notes.md
          make_latest: true
          files: |
            outputs/*.zip
            outputs/*.apk

  deploy-hub:
    runs-on: ubuntu-latest
    needs:
      - build
      - release
    if: needs.build.outputs.is_release == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: download-page
          path: hub/content/posts/downloads/

      - name: Set up Hugo
        uses: peaceiris/actions-hugo@2752ce1d29631191ea3f27c23495fa06139a5b78 # v3.2.1
        with:
          hugo-version: "0.168.0"
          extended: true

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Build hub
        working-directory: hub
        env:
          PAGES_BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: hugo --destination public --baseURL "$PAGES_BASE_URL/"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: hub/public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
